# Test profile — H2 in-memory database so the app can boot without PostgreSQL.
# This file is only loaded when --spring.profiles.active=test is passed.

spring.application.name=SGI

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:sgi_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true

# Server
server.port=8080
server.servlet.context-path=

# JWT
jwt.secret=testSecretKeyForJWTTokenGenerationAndValidationMustBeAtLeast256Bit
jwt.expiration=86400000

# Security - RBAC : manager de test promu ADMIN pour les tests RBAC
sgi.security.admin-emails=admin@sgi.test

# Logging
logging.level.root=INFO
logging.level.com.SSS.SGI=DEBUG
