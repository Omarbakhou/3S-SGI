spring.application.name=SGI

spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration (H2 default)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Server Configuration
server.port=8081
server.servlet.context-path=

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Security - RBAC : emails de managers promus ADMIN (pas d'entité Admin en base)
sgi.security.admin-emails=${ADMIN_EMAILS:}

# Logging
logging.level.root=INFO
logging.level.com.SSS.SGI=DEBUG

# Absences - stockage des justificatifs
sgi.fichiers.dossier-justificatifs=./justificatifs
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
