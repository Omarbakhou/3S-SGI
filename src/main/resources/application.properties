spring.application.name=SGI

spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Migrations Flyway : c'est Flyway qui construit et fait evoluer le schema.
# baseline-on-migrate + baseline-version=1 : sur une base deja creee par
# l'ancien ddl-auto=update, V1 (le baseline) est marquee comme deja appliquee
# et seules les migrations suivantes tournent. Sur une base vierge, V1 puis V2
# sont jouees normalement.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# JPA Configuration
# validate (et non update) : Hibernate verifie que le schema correspond aux
# entites mais ne le modifie plus, toute evolution passe par une migration.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
# Pas de defer-datasource-initialization : cette option n'a de sens que pour jouer
# un data.sql apres la creation du schema par ddl-auto. Avec Flyway elle range en
# plus l'EntityManagerFactory parmi les initialiseurs de base, ce qui cree un cycle
# de dependances avec flywayInitializer et empeche l'application de demarrer.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Server Configuration
server.port=8081
server.servlet.context-path=

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Security - RBAC : emails de managers promus ADMIN (pas d'entité Admin en base)
sgi.security.admin-emails=${ADMIN_EMAILS:}

# Logging
logging.level.root=INFO
logging.level.com.SSS.SGI=DEBUG

# Absences - stockage des justificatifs
sgi.fichiers.dossier-justificatifs=./justificatifs
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
